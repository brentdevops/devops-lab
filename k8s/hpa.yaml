apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-lab
  minReplicas: 2
  maxReplicas: 5
  metrics:
    # Scales on CPU as a percentage of the *request* (50m), not the limit.
    # 60% of 50m = 30m sustained triggers a scale-up.
    # Requires metrics-server; without it the HPA reports <unknown>.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
