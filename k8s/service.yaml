apiVersion: v1
kind: Service
metadata:
  name: platform-lab
spec:
  type: ClusterIP
  # This selector must match the pod labels in deployment.yaml.
  # A mismatch here is the classic cause of 503s: the Service exists,
  # has zero endpoints, and silently routes nowhere.
  # Check with: kubectl get endpoints platform-lab
  selector:
    app: platform-lab
  ports:
    - port: 80
      targetPort: 8080
