apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-lab
  labels:
    app: platform-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-lab
  template:
    metadata:
      labels:
        app: platform-lab
    spec:
      containers:
        - name: app
          # IMAGE_PLACEHOLDER is substituted by CI with the SHA-tagged image.
          # Never "latest" — every deploy must trace to one commit.
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080

          resources:
            # requests = what the scheduler reserves. Too high wastes the node.
            requests:
              cpu: 50m
              memory: 32Mi
            # limits = the hard ceiling. Over CPU limit means throttled;
            # over memory limit means OOMKilled.
            limits:
              cpu: 200m
              memory: 64Mi

          # Liveness: is the process alive? Failing this RESTARTS the container.
          # Must not depend on anything downstream.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

          # Readiness: should this pod get traffic? Failing this REMOVES the pod
          # from Service endpoints without restarting it.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
