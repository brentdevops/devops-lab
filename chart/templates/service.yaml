apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-lab.fullname" . }}
  labels:
    {{- include "platform-lab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # Same helper the pod template uses, so these can never drift apart.
  selector:
    {{- include "platform-lab.selectorLabels" . | nindent 4 }}
